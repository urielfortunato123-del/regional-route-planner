# Render Blueprint — Fiscalização DER (TanStack Start / Node.js)
# Docs: https://render.com/docs/blueprint-spec
# Nunca coloque segredos aqui: variáveis com `sync: false` são preenchidas no painel do Render.

services:
  - type: web
    name: fiscalizacao-der
    runtime: node
    # Use a região mais próxima do banco (Supabase). Ajuste se o banco não estiver no leste dos EUA.
    region: ohio
    # Instância paga: mantém o serviço sempre ativo (o plano free suspende após 15 min).
    plan: starter
    branch: main
    autoDeploy: true
    numInstances: 1

    buildCommand: npm ci && npm run build
    startCommand: npm run start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: APP_VERSION
        value: "1.0.0"

      # Gerado pelo Render, nunca versionado
      - key: SESSION_SECRET
        generateValue: true

      # --- Segredos / configuração: preencher no painel do Render ---
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OSRM_BASE_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false

      # --- Variáveis expostas ao navegador (publicáveis, sem chaves privadas) ---
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: DER_MAP_SERVICE_URL
        sync: false
      - key: VITE_DER_MAP_SERVICE_URL
        sync: false
